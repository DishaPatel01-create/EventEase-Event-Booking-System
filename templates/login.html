{% extends 'base.html' %}

{% block title %}Sign In - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-xl rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="{{ app_name }}" height="42" class="mb-3">
                    <h3 class="fw-bold mb-1">Welcome back to {{ app_name }}</h3>
                    <p class="text-muted small">Sign in to access your tickets and events</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <!-- Role Selection Cards -->
                    <div class="mb-4">
                        <label class="form-label small fw-bold mb-2">Account Type:</label>
                        <div class="row g-2">
                            <div class="col-4">
                                <input type="radio" class="btn-check" name="role" id="login-role-attendee" value="attendee" {% if selected_role == 'attendee' or not selected_role %}checked{% endif %}>
                                <label class="btn btn-outline-primary w-100 p-2 text-center rounded-3 h-100 d-flex flex-column align-items-center justify-content-center" for="login-role-attendee">
                                    <i class="fa-solid fa-user fs-5 mb-1"></i>
                                    <span class="fw-bold small">Attendee</span>
                                </label>
                            </div>
                            <div class="col-4">
                                <input type="radio" class="btn-check" name="role" id="login-role-organizer" value="organizer" {% if selected_role == 'organizer' %}checked{% endif %}>
                                <label class="btn btn-outline-primary w-100 p-2 text-center rounded-3 h-100 d-flex flex-column align-items-center justify-content-center" for="login-role-organizer">
                                    <i class="fa-solid fa-bullhorn fs-5 mb-1"></i>
                                    <span class="fw-bold small">Organizer</span>
                                </label>
                            </div>
                            <div class="col-4">
                                <input type="radio" class="btn-check" name="role" id="login-role-admin" value="admin" {% if selected_role == 'admin' %}checked{% endif %}>
                                <label class="btn btn-outline-primary w-100 p-2 text-center rounded-3 h-100 d-flex flex-column align-items-center justify-content-center" for="login-role-admin">
                                    <i class="fa-solid fa-shield-halved fs-5 mb-1"></i>
                                    <span class="fw-bold small">Admin</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Email Address -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold" for="login-email">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                            <input type="email" id="login-email" name="email" value="{{ email or '' }}" class="form-control" placeholder="Enter your email" autocomplete="username" required autofocus>
                        </div>
                    </div>

                    <!-- Password with Show/Hide Toggle -->
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label small fw-bold" for="login-password">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" id="login-password" name="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
                            <button type="button" class="btn btn-outline-secondary toggle-password-btn" data-target="login-password" title="Show/Hide Password">
                                <i class="fa-solid fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input type="checkbox" name="remember" class="form-check-input" id="rememberMe">
                            <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3 shadow">
                        Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
                    </button>
                </form>

                <div class="text-center mt-3 small text-muted">
                    Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-bold text-primary">Create Account</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    // Password visibility toggler
    document.querySelectorAll('.toggle-password-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const targetId = this.getAttribute('data-target');
            const input = document.getElementById(targetId);
            const icon = this.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        });
    });
});
</script>
{% endblock %}
{% endblock %}
