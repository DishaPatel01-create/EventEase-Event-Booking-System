{% extends 'base.html' %}

{% block title %}403 - Forbidden Access{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card border-0 shadow-lg rounded-4 p-5 max-w-500 mx-auto my-5">
        <div class="display-1 text-danger fw-bold mb-2">403</div>
        <div class="h3 fw-bold mb-3"><i class="fa-solid fa-lock text-danger me-2"></i> Access Denied</div>
        <p class="text-muted mb-4">
            You do not have permission to view or manage this restricted resource. Please make sure you are logged in with the appropriate account role.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('home.index') }}" class="btn btn-primary">
                <i class="fa-solid fa-house me-1"></i> Return Home
            </a>
            <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary">
                <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
